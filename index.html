<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My ToDo List</title>
        <!-- Add file main of Style -->
        <link rel="stylesheet" href="style.css">
        <!-- Add link Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" >
        <!-- Add link Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <!-- Add link Font family -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body class="w-100 vh-100 d-flex align-items-center justify-content-center">
        
        <main class="my-todo-list container">
            <h1>My Todos</h1>

            <!-- Input Field -->
            <form class="input-field">
                <div class="input-group">
                    <input type="text" class="form-control" 
                    aria-label="task" autocomplete="off" maxlength="200" 
                    placeholder="What needs to be done?" >
                    <button type="submit" class="input-group-text">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </form>

            <!-- Section Tasks Fill auto in JS-->
            <ul class="box-tasks overflow-y-auto position-relative ">
            </ul>

            <!-- Filtering -->
            <div class="filters-bar">
                <button type="button" data-filter="all" class="active">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>

            <!-- Footer -->
            <footer>
                <div class="items-counter">All done! 🎉</div>
                <button class="clear-completed ">Clear Completed</button>
            </footer>
        </main>

        <!-- Add file main JS -->
        <script src="main.js"></script>
    </body>
</html>
